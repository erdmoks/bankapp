<!doctype html>
<html lang="tr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MiniBank{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
  <nav class="navbar">
    <a class="brand" href="{{ url_for('customer.home') }}">MiniBank</a>

    {% if session.get('customer_id') %}
    <div class="nav-links">
      <a href="{{ url_for('customer.dashboard') }}">Dashboard</a>
      <a href="{{ url_for('transfer.transfer_money') }}">Para Transferi</a>
      <a href="{{ url_for('settings.change_password') }}">Ayarlar</a>
      <a href="{{ url_for('auth.logout') }}">Çıkış</a>
    </div>
    {% endif %}
  </nav>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="alert {{ category }}">{{ message }}</div>
    {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>

</html>
