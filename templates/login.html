{% extends 'base.html' %}
{% block title %}Giriş | MiniBank{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Hoş geldiniz</h1>
  <p>Hesabınıza güvenle giriş yapın.</p>
  <form method="post">
    <label>E-posta<input type="email" name="email" required autofocus></label>
    <label>Şifre<input type="password" name="password" required></label>
    <button type="submit">Giriş yap</button>
  </form>
  <p class="center">Hesabınız yok mu? <a href="{{ url_for('auth.register') }}">Kayıt olun</a></p>
</section>
{% endblock %}
